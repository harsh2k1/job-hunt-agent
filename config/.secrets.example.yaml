# Copy to config/.secrets.yaml and fill in. .secrets.yaml is gitignored, never commit it.
# Same layout as settings.yaml: everything goes under `default:`.
#
# Keys get added as each source lands:
#   Phase 3: one search provider key (serper / serpapi / brave / exa)
#   Phase 4: KCL login (below); Gmail uses its own OAuth file, see email_alerts
#   Phase 7: google service account for the sheet sync

default:
  job_sources:
    # Each source below also needs enabled: true, in settings.yaml or
    # settings.local.yaml.
    #
    # Google Jobs through SerpApi; free plan at serpapi.com (250 searches/month)
    serpapi_google_jobs:
      api_key: "..."
    # free at developer.adzuna.com (250 requests/day)
    adzuna:
      app_id: "..."
      app_key: "..."
    # free at reed.co.uk/developers
    reed:
      api_key: "..."

  # Your King's account, for KCL Target Connect. The agent signs in with it
  # and keeps the browser session in data/; if King's asks for an
  # Authenticator approval, a browser window opens once for you to approve.
  portal_logins:
    kcl:
      username: "k1234567@kcl.ac.uk"
      password: "..."

