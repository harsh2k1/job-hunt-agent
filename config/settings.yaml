# Defaults for every run. Ways to override, later ones win:
#   - another environment section below, picked with JOBHUNT_ENV=<name>
#     (only the keys that change; the rest comes from default)
#   - config/settings.local.yaml (gitignored), same layout as this file
#   - config/.secrets.yaml (gitignored), API keys and logins only
#   - env vars for a single run, e.g. JOBHUNT_LOGGING__LEVEL=DEBUG

default:
  logging:
    level: INFO
    format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"
    # daily runs happen unattended, so every run also leaves a log file behind
    file: "@format {this.REPO_ROOT}/logs/job_hunt.log"
    file_max_megabytes: 5
    file_backup_count: 5

  database:
    # sqlite or postgres; only the block named here is used
    backend: sqlite
    # print every SQL statement; only useful when debugging a query
    echo_sql: false
    sqlite:
      path: "@format {this.REPO_ROOT}/data/job_hunt.db"
    postgres:
      host: localhost
      port: 5432
      database_name: job_hunt
      username: job_hunt
      # set in config/.secrets.yaml
      password: null
      pool_size: 5
      max_overflow: 5

  cache:
    # API responses are cached so a rerun on the same day doesn't hit every
    # source again (and so we stay inside free-tier limits).
    # disk survives between runs; memory lasts one run (used by the tests)
    backend: disk
    key_prefix: v1
    default_ttl_hours: 12
    disk:
      dir: "@format {this.REPO_ROOT}/data/cache"
      size_limit_megabytes: 512
    memory:
      max_entries: 10000

  http:
    timeout_seconds: 30
    # retried on connection errors, 429 and 5xx, waiting backoff * 2^attempt
    max_retries: 3
    backoff_seconds: 2
    # be polite to public job feeds: at most one request per host this often
    min_seconds_between_requests_to_same_host: 1.0
    user_agent: "job-hunt-agent/0.1 (personal job search)"

  job_search:
    # Job boards are searched for every term in every location. Kept broad on
    # purpose: relevance filtering comes later, and a missed job costs more
    # than an extra row.
    role_terms:
      - graduate data scientist
      - data scientist
      - data science intern
      - data science graduate scheme
      - graduate machine learning engineer
      - machine learning engineer
      - machine learning intern
      - AI engineer
      - AI graduate scheme
      - applied scientist
      - research engineer machine learning
      - research scientist machine learning
      - NLP engineer
      - LLM engineer
    # London first, then the whole UK: a country-wide search returns its top
    # results only, so London on its own still surfaces London roles the UK
    # search would push out. Spelled "United Kingdom": Reed reads "UK" as
    # somewhere near Manchester.
    locations:
      - London
      - United Kingdom
    # Used where a source returns every office worldwide (company boards, HN,
    # The Intake, jobs.ac.uk). Whole words, any case: "uk" matches
    # "Remote - UK" but not "Ukraine". Cities are listed because adverts often
    # give only the city. Left out on purpose: names that are also everyday
    # words or places elsewhere (Reading, Bath, York; "wales" would match New
    # South Wales, so Welsh cities are listed instead). Postings with no
    # location at all are kept so they can be checked by hand.
    target_location_keywords:
      - london
      - united kingdom
      - uk
      - england
      - scotland
      - northern ireland
      - great britain
      - britain
      - manchester
      - birmingham
      - leeds
      - bristol
      - cambridge
      - oxford
      - edinburgh
      - glasgow
      - aberdeen
      - dundee
      - cardiff
      - belfast
      - newcastle upon tyne
      - sheffield
      - nottingham
      - liverpool
      - southampton
      - swansea
    # daily runs overlap by design; already-seen jobs are only updated
    max_posting_age_hours: 168
    indeed_country: UK
    search_radius_miles: 20

  job_sources:
    # big job boards, read through JobSpy
    indeed:
      enabled: true
      results_per_search: 50
    linkedin:
      enabled: true
      results_per_search: 25
      fetch_descriptions: true
    glassdoor:
      # often blocked; turned on once it proves reliable
      enabled: false
      results_per_search: 25
    google_jobs:
      # JobSpy's Google scraper gets "no job data" back from Google for every
      # query, including JobSpy's own example (checked 2026-11-09); back on
      # once a JobSpy release fixes it
      enabled: false
      results_per_search: 30
      search_term_template: "{role} jobs near {location} since last week"
    # Google Jobs through SerpApi, which handles Google's CAPTCHAs (a browser
    # from here gets one on the first request). Free plan: 250 searches a
    # month, so 8 terms x 1 page a day fits. Needs api_key in .secrets.yaml.
    serpapi_google_jobs:
      enabled: true
      api_key: null
      search_terms:
        - graduate data scientist
        - data science graduate scheme 2027
        - machine learning engineer graduate
        - AI engineer graduate
        - data science internship
        - machine learning internship
        - junior data scientist
        - research engineer machine learning
      location: London, England, United Kingdom
      google_domain: google.co.uk
      country_code: uk
      pages_per_search: 1
      searches_kept_in_reserve: 10
      cache_ttl_hours: 20

    # UK job boards with their own free search API; searched with the
    # job_search role terms and locations. Off until the keys are in
    # .secrets.yaml (the fetch fails loudly without them).
    adzuna:
      # free plan: 250 requests a day; 14 terms x 2 pages fits
      enabled: false
      app_id: null
      app_key: null
      country_code: gb
      results_per_page: 50
      pages_per_search: 2
      cache_ttl_hours: 20
    reed:
      enabled: true
      api_key: null
      results_per_page: 100
      pages_per_search: 2
      cache_ttl_hours: 20

    # Big employers' own careers searches, no key needed
    microsoft_careers:
      enabled: true
      # the API's fixed page size
      results_per_page: 10
      pages_per_search: 3
      cache_ttl_hours: 20
    amazon_jobs:
      enabled: true
      country_code: GBR
      results_per_page: 100
      pages_per_search: 2
      cache_ttl_hours: 20

    # the monthly "Ask HN: Who is hiring?" thread, through HN's public API;
    # kept when the posting's first line mentions a target location
    hacker_news_hiring:
      enabled: true
      threads_to_read: 1
      cache_ttl_hours: 12

    # Sites with one page per advert carrying schema.org JobPosting markup
    # (the data Google for Jobs reads). Only pages robots.txt allows.
    jointheintake:
      # graduate schemes and internships with closing dates. About 1,000
      # adverts (roughly 20 minutes at one request a second the first time);
      # after that only the ones its sitemap says have changed.
      enabled: true
      page_cache_ttl_hours: 720
      max_page_downloads_per_run: 1500
      # law-only sections (training contracts, vacation schemes, paralegal)
      # are left out
      sections:
        - graduate-schemes
        - internships
        - placements
        - spring-weeks
        - insight-days
        - first-year-schemes
    jobs_ac_uk:
      # universities and research institutes; searched with the job_search
      # role terms and locations
      enabled: true
      pages_per_search: 2
      page_cache_ttl_hours: 168
      max_page_downloads_per_run: 500
      search_cache_ttl_hours: 20
    meta_careers:
      # Meta's jobs sitemap, ~1,350 jobs worldwide; its dates are per job,
      # so after the first runs only changed jobs are downloaded
      enabled: true
      page_cache_ttl_hours: 720
      max_page_downloads_per_run: 1500
    student_circus:
      # visa-sponsoring employers. Public advert pages, no login (only the
      # description is behind one). About 6,400 adverts: the first runs take
      # 1,500 a run (about 25 minutes), after that only new ones. Its
      # sitemap dates are all the same, so adverts are kept for 30 days.
      enabled: true
      page_cache_ttl_hours: 720
      max_page_downloads_per_run: 1500

    # Job alert emails in Gmail (read only): the saved searches on LinkedIn
    # and Indeed, and the portals that can't be read directly (Gradcracker,
    # Handshake, Welcome to the Jungle, TargetJobs, Prospects, ...). Needs
    # the OAuth client file; the first run asks for consent in the browser
    # once.
    email_alerts:
      enabled: true
      gmail_client_secret_path: "@format {this.REPO_ROOT}/config/gmail_client_secret.json"
      gmail_token_path: "@format {this.REPO_ROOT}/data/gmail_token.json"
      # The OAuth app stays in Testing (publishing needs a home page and a
      # privacy policy), so Google expires the token every 7 days and the
      # consent page opens again; a run waits this long for the approval.
      gmail_consent_timeout_seconds: 300
      # Job-alert senders only, by exact address where known, so personal
      # mail (LinkedIn messages and invitations, recruiter messages on
      # Indeed) is never read. Runs overlap; jobs are matched by site and
      # id, so an advert seen twice is one job.
      # Indeed senders (alert@indeed.com, donotreply@match.indeed.com) are
      # left out until the Indeed profile is set up for full-time roles;
      # their parser stays ready.
      gmail_query: >-
        newer_than:7d from:(jobalerts-noreply@linkedin.com
        OR jobs-noreply@linkedin.com
        OR handshake@notifications.joinhandshake.com OR gradcracker.com
        OR welcometothejungle.com OR targetjobs.co.uk OR prospects.ac.uk
        OR brightnetwork.co.uk OR workinstartups.com)
      max_messages_per_run: 300
      message_cache_ttl_hours: 720

    # King's CareerConnect (Target Connect), jobs posted to King's students.
    # Read in a real browser with a saved profile; the first sign-in is done
    # by a person (passkey / 2FA), later runs reuse it. Login in
    # .secrets.yaml under portal_logins.kcl (only used to fill the username,
    # and the password if King's asks for one).
    kcl_target_connect:
      enabled: true
      browser_profile_dir: "@format {this.REPO_ROOT}/data/browser_profiles/kcl_target_connect"
      silent_sign_in_seconds: 30
      allow_visible_sign_in: true
      sign_in_wait_seconds: 600
      max_result_pages: 10

    # companies' own job boards, read for every tracked company on that ATS
    greenhouse:
      enabled: true
    lever:
      enabled: true
    lever_eu:
      enabled: true
    ashby:
      enabled: true
    workable:
      enabled: true
    smartrecruiters:
      enabled: true
      country_code: gb
      page_size: 100
    teamtailor:
      enabled: true
    recruitee:
      enabled: true
    pinpoint:
      enabled: true
    personio:
      enabled: true
    bamboohr:
      enabled: true
    # Workday careers sites (big UK employers: retail, banks, ...): the
    # sitemap, then the JobPosting markup on each job page
    workday:
      enabled: true
      page_cache_ttl_hours: 168
      max_page_downloads_per_board: 300
      board_check_sample_pages: 15

  companies:
    # London AI / data / tech employers that hold a Skilled Worker sponsor
    # licence and have a board on a supported ATS; checked against the Home
    # Office register before being added here
    seed_list_path: "@format {this.REPO_ROOT}/config/seed_companies.yaml"

  company_discovery:
    # Two ways to find boards. Web searches limited to ATS domains (site:jobs.ashbyhq.com ...) find
    # company boards; each board found is then read in full every day by its
    # ATS source. Run with `job-hunt discover-companies`, daily.
    # Queries: every ATS domain x location x role phrase (168 today). Free
    # engines block a burst (168 in a row got this machine rate-limited on
    # 2026-11-10), so each run sends at most max_searches_per_run and the
    # next run carries on; at 20 a day, every query is covered in about 8
    # days, and the week-long cache keeps the cycle going.
    search_provider: ddgs
    role_phrases:
      - data scientist
      - machine learning engineer
      - AI engineer
      - graduate data
      - machine learning intern
      - research scientist
    results_per_query: 20
    cache_ttl_hours: 168
    max_searches_per_run: 20
    max_consecutive_failures: 3
    seconds_between_searches: 5
    ddgs:
      region: uk-en
      backend: auto
      timeout_seconds: 15
    # The second way in, with no search engine: Common Crawl's public URL
    # index lists every crawled page on each ATS domain, so every board on
    # it. Each board not yet tracked is read once and kept only if it has a
    # job in a target location. The first runs work through a few thousand
    # boards (about an hour per 1,000 checks at one request a second per
    # ATS); after that only boards new to the crawl.
    common_crawl:
      crawls_to_read: 3
      max_board_checks_per_run: 1000
      board_recheck_after_hours: 720
      board_list_cache_ttl_hours: 2160

  # Each source is judged against its own recent runs: a failed run, or a
  # count far below its usual one, is flagged after every fetch.
  source_health:
    baseline_runs: 7
    min_runs_for_baseline: 3
    drop_warning_ratio: 0.3

  # Titles are sorted for free before any LLM sees them. A title with a
  # keep term goes on to the advert reading; one with a drop term (and no
  # keep term: keep wins) is skipped as unrelated; the rest are judged by
  # the LLM from the title, anything doubtful kept. Whole words, any case.
  # Drop terms name other trades only, so a relevant title can't be lost.
  title_rules:
    keep_terms:
      - data
      - analyst
      - analysts
      - analytics
      - analytical
      - scientist
      - scientists
      - data science
      - machine learning
      - ml
      - ai
      - artificial intelligence
      - llm
      - llms
      - genai
      - generative
      - nlp
      - computer vision
      - deep learning
