  llm:
    backend: claude_cli
    claude_cli_binary: claude
    timeout_seconds: 600

  # LLM screening of what the rule pass keeps. The model only reads facts
  # out of each advert (field, kind, part-time, start); code then skips a
  # listing only if it's unrelated or can't be taken. Each listing is
  # screened once, again only if its advert changes. Haiku reads everything;
  # Sonnet only re-reads adverts whose field Haiku couldn't tell.
  llm_screening:
    enabled: true
    first_pass_model: haiku
    second_pass_model: sonnet
    batch_size: 20
    title_batch_size: 150
    advert_opening_chars: 1200
    advert_key_fact_chars: 1500
    max_listings_per_run: 300
    available_full_time_from: September 2027
    # A role is skipped for its field only if it involves none of these;
    # anything doubtful stays. The only other skip: full-time and not
    # starting once free (available_full_time_from).
    relevant_fields:
      - data science
      - machine learning
      - AI
      - analytics
      - data analysis
      - data engineering
      - NLP
      - computer vision
      - MLOps
      - Python development
      - machine learning or AI research
      - quantitative research
      - fraud, risk or financial-crime analytics

  # The job list in a Google Sheet, rewritten after every run. Status and
  # Notes are yours: a sync keeps what's typed there. Share the sheet with
  # the service account (client_email in .secrets.yaml) as Editor and put
  # its URL in settings.local.yaml.
  google_sheet:
    enabled: true
    spreadsheet_url: null
    jobs_worksheet: Jobs
    skipped_worksheet: Skipped
    listing_days: 14
    # set in .secrets.yaml
    service_account: null

  # Accounts for portals that need a login; the details go in
  # config/.secrets.yaml, never here.
  portal_logins:
    kcl: null

# used by the test suite; anything that writes goes to a throwaway folder
testing:
  logging:
    level: DEBUG
    file: "@format {this.REPO_ROOT}/.pytest_tmp/job_hunt.log"
  database:
    sqlite:
      path: "@format {this.REPO_ROOT}/.pytest_tmp/job_hunt.db"
  cache:
    backend: memory
    disk:
      dir: "@format {this.REPO_ROOT}/.pytest_tmp/cache"
  http:
    max_retries: 2
    backoff_seconds: 0
    min_seconds_between_requests_to_same_host: 0
  company_discovery:
    seconds_between_searches: 0
  job_sources:
    kcl_target_connect:
      # tests never open a browser window
      allow_visible_sign_in: false
