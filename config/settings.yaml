# Defaults for every run. Ways to override, later ones win:
#   - another environment section below, picked with JOBHUNT_ENV=<name>
#     (only the keys that change; the rest comes from default)
#   - config/settings.local.yaml (gitignored), same layout as this file
#   - config/.secrets.yaml (gitignored), API keys and logins only
#   - env vars for a single run, e.g. JOBHUNT_LOGGING__LEVEL=DEBUG

default:
  logging:
    level: INFO
    format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"
    # daily runs happen unattended, so every run also leaves a log file behind
    file: "@format {this.REPO_ROOT}/logs/job_hunt.log"
    file_max_megabytes: 5
    file_backup_count: 5

  database:
    # sqlite or postgres; only the block named here is used
    backend: sqlite
    # print every SQL statement; only useful when debugging a query
    echo_sql: false
    sqlite:
      path: "@format {this.REPO_ROOT}/data/job_hunt.db"
    postgres:
      host: localhost
      port: 5432
      database_name: job_hunt
      username: job_hunt
      # set in config/.secrets.yaml
      password: null
      pool_size: 5
      max_overflow: 5

  cache:
    # API responses are cached so a rerun on the same day doesn't hit every
    # source again (and so we stay inside free-tier limits).
    # disk survives between runs; memory lasts one run (used by the tests)
    backend: disk
    key_prefix: v1
    default_ttl_hours: 12
    disk:
      dir: "@format {this.REPO_ROOT}/data/cache"
      size_limit_megabytes: 512
    memory:
      max_entries: 10000

  http:
    timeout_seconds: 30
    # retried on connection errors, 429 and 5xx, waiting backoff * 2^attempt
    max_retries: 3
    backoff_seconds: 2
    # be polite to public job feeds: at most one request per host this often
    min_seconds_between_requests_to_same_host: 1.0
    user_agent: "job-hunt-agent/0.1 (personal job search)"

  job_search:
    # Job boards are searched for every term in every location. Kept broad on
    # purpose: relevance filtering comes later, and a missed job costs more
    # than an extra row.
    role_terms:
      - graduate data scientist
      - data scientist
      - data science intern
      - data science graduate scheme
      - graduate machine learning engineer
      - machine learning engineer
      - machine learning intern
      - AI engineer
      - AI graduate scheme
      - applied scientist
      - research engineer machine learning
      - research scientist machine learning
      - NLP engineer
      - LLM engineer
    # London first, then the whole UK: a country-wide search returns its top
    # results only, so London on its own still surfaces London roles the UK
    # search would push out. Spelled "United Kingdom": Reed reads "UK" as
    # somewhere near Manchester.
    locations:
      - London
      - United Kingdom
    # Used where a source returns every office worldwide (company boards, HN,
    # The Intake, jobs.ac.uk). Whole words, any case: "uk" matches
    # "Remote - UK" but not "Ukraine". Cities are listed because adverts often
    # give only the city. Left out on purpose: names that are also everyday
    # words or US places in adverts (Reading, Bath, York). Postings with no
    # location at all are kept so they can be checked by hand.
    target_location_keywords:
      - london
      - united kingdom
      - uk
      - england
      - scotland
      - wales
      - northern ireland
      - great britain
      - britain
      - manchester
      - birmingham
      - leeds
      - bristol
      - cambridge
      - oxford
      - edinburgh
      - glasgow
      - aberdeen
      - dundee
      - cardiff
      - belfast
      - newcastle upon tyne
      - sheffield
      - nottingham
      - liverpool
      - southampton
    # daily runs overlap by design; already-seen jobs are only updated
    max_posting_age_hours: 168
    indeed_country: UK
    search_radius_miles: 20

  job_sources:
    # big job boards, read through JobSpy
    indeed:
      enabled: true
      results_per_search: 50
    linkedin:
      enabled: true
      results_per_search: 25
      fetch_descriptions: true
    glassdoor:
      # often blocked; turned on once it proves reliable
      enabled: false
      results_per_search: 25
    google_jobs:
      # JobSpy's Google scraper gets "no job data" back from Google for every
      # query, including JobSpy's own example (checked 2026-11-09); back on
      # once a JobSpy release fixes it
      enabled: false
      results_per_search: 30
      search_term_template: "{role} jobs near {location} since last week"
    # Google Jobs through SerpApi, which handles Google's CAPTCHAs (a browser
    # from here gets one on the first request). Free plan: 250 searches a
    # month, so 8 terms x 1 page a day fits. Needs api_key in .secrets.yaml.
    serpapi_google_jobs:
      enabled: true
      api_key: null
      search_terms:
        - graduate data scientist
        - data science graduate scheme 2027
        - machine learning engineer graduate
        - AI engineer graduate
        - data science internship
        - machine learning internship
        - junior data scientist
        - research engineer machine learning
      location: London, England, United Kingdom
      google_domain: google.co.uk
      country_code: uk
      pages_per_search: 1
      searches_kept_in_reserve: 10
      cache_ttl_hours: 20

    # UK job boards with their own free search API; searched with the
    # job_search role terms and locations. Off until the keys are in
    # .secrets.yaml (the fetch fails loudly without them).
    adzuna:
      # free plan: 250 requests a day; 14 terms x 2 pages fits
      enabled: false
      app_id: null
      app_key: null
      country_code: gb
      results_per_page: 50
      pages_per_search: 2
      cache_ttl_hours: 20
    reed:
      enabled: true
      api_key: null
      results_per_page: 100
      pages_per_search: 2
      cache_ttl_hours: 20

    # the monthly "Ask HN: Who is hiring?" thread, through HN's public API;
    # kept when the posting's first line mentions a target location
    hacker_news_hiring:
      enabled: true
      threads_to_read: 1
      cache_ttl_hours: 12

    # Sites with one page per advert carrying schema.org JobPosting markup
    # (the data Google for Jobs reads). Only pages robots.txt allows.
    jointheintake:
      # graduate schemes and internships with closing dates. The first run
      # reads about 1,000 adverts (roughly 20 minutes at one request a
      # second); after that only the ones its sitemap says have changed.
      enabled: true
      page_cache_ttl_hours: 720
      # law-only sections (training contracts, vacation schemes, paralegal)
      # are left out
      sections:
        - graduate-schemes
        - internships
        - placements
        - spring-weeks
        - insight-days
        - first-year-schemes
    jobs_ac_uk:
      # universities and research institutes; searched with the job_search
      # role terms and locations
      enabled: true
      pages_per_search: 2
      page_cache_ttl_hours: 168
      search_cache_ttl_hours: 20

    # companies' own job boards, read for every tracked company on that ATS
    greenhouse:
      enabled: true
    lever:
      enabled: true
    lever_eu:
      enabled: true
    ashby:
      enabled: true
    workable:
      enabled: true
    smartrecruiters:
      enabled: true
      country_code: gb
      page_size: 100

  companies:
    # London AI / data / tech employers that hold a Skilled Worker sponsor
    # licence and have a board on a supported ATS; checked against the Home
    # Office register before being added here
    seed_list_path: "@format {this.REPO_ROOT}/config/seed_companies.yaml"

# used by the test suite; anything that writes goes to a throwaway folder
testing:
  logging:
    level: DEBUG
    file: "@format {this.REPO_ROOT}/.pytest_tmp/job_hunt.log"
  database:
    sqlite:
      path: "@format {this.REPO_ROOT}/.pytest_tmp/job_hunt.db"
  cache:
    backend: memory
    disk:
      dir: "@format {this.REPO_ROOT}/.pytest_tmp/cache"
  http:
    max_retries: 2
    backoff_seconds: 0
    min_seconds_between_requests_to_same_host: 0
