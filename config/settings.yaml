      - quants
      - quantitative
      - statistician
      - statistics
      - statistical
      - insight
      - insights
      - bi
      - business intelligence
      - mlops
      - research engineer
      - research scientist
      - applied scientist
      - algorithm
      - algorithms
      - econometrics
      - actuarial
      - modelling
      - modeller
      - fraud
      - risk analytics
      - research
