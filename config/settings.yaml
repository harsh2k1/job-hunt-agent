      - operative
      - electrician
      - plumber
      - mechanic
      - technician
      - welder
      - carpenter
      - joiner
      - retail
      - store
      - shop
      - cashier
      - sales
      - account executive
      - account manager
      - business development
      - recruiter
      - recruitment
      - talent acquisition
      - teacher
