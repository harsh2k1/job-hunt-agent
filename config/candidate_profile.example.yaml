# Copy to config/candidate_profile.yaml (gitignored) and fill in. Sent with
# every LLM screening batch, so keep it short; changing it re-screens every
# listing. Any keys work; these are the ones the screening reads best.
experience: >-
  Years and kind of hands-on work, roles held, anything published.
strengths: >-
  Domains and tools you're strongest in.
education: >-
  Degrees, with the expected graduation date.
looking_for: >-
  The roles and levels you want, and second choices.
availability: >-
  Part-time or full-time, and from when.
right_to_work: >-
  Visa status, whether sponsorship is needed, where you can work.
