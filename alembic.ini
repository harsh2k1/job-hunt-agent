# Alembic reads this file when run from the command line, e.g.
#   alembic revision --autogenerate -m "add salary to jobs"
# The database it connects to comes from config/settings.yaml (see
# migrations/env.py), not from a URL here, so every backend works the same way.
# The app itself applies migrations with `job-hunt migrate-db`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# date first so migrations list in the order they were written
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 60
