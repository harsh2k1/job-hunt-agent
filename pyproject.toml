[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunt-agent"
version = "0.1.0"
description = "Finds data science and AI openings across job boards, company career pages and student portals, and keeps track of them"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "dynaconf>=3.2",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "httpx>=0.27",
    "diskcache>=5.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# only when database.backend is postgres
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
job-hunt = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
