[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunt-agent"
version = "0.1.0"
description = "Finds data science and AI openings across job boards, company career pages and student portals, and keeps track of them"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "dynaconf>=3.2",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "httpx>=0.27",
    "diskcache>=5.6",
    # the hand-edited company seed list
    "pyyaml>=6.0",
    # Indeed, LinkedIn, Glassdoor and Google Jobs
    "python-jobspy>=1.3",
    # free web search (no key) for finding company job boards
    "ddgs>=9.10",
    # reading job alert emails from Gmail
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    # writing the job list to a Google Sheet
    "gspread>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# only when database.backend is postgres
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
job-hunt = "job_hunt.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, pyupgrade, bugbear, simplify
select = ["F", "E", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["job_hunt"]
